[project]
name = "datalegion-cli"
version = "1.6.0"
description = "CLI for the Data Legion API — agent-friendly, fully async"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Data Legion", email = "engineering@datalegion.ai" }]
keywords = [
    "datalegion",
    "cli",
    "enrichment",
    "person-enrichment",
    "company-enrichment",
    "data-enrichment",
    "b2b",
    "contact-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.0",
    # httpx verifies TLS against certifi's bundle. 2026.10.19 drops emSign ECC Root CA - G3, whose
    # intermediates were compromised (GHSA-6q48-6c7w-9gw2), so upgrading the CLI fixes it.
    "certifi>=2026.10.19",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "rich>=13.9.0",
    "tomli-w>=1.0.0",
    "packaging>=24.0",
    "loguru>=0.7.0",
    "cryptography>=44.0.0",
]

[project.scripts]
datalegion-cli = "datalegion_cli.main:run"

[project.urls]
Homepage = "https://www.datalegion.ai"
Documentation = "https://www.datalegion.ai/docs"
Repository = "https://github.com/datalegion-ai/datalegion-cli"
Issues = "https://github.com/datalegion-ai/datalegion-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalegion_cli"]

# The sdist carries the source, tests and license, never repo tooling (.github/, .claude/,
# lefthook.yml). Its tests must pass from the sdist alone, so the conventions tests, which read
# the git index, stay out.
[tool.hatch.build.targets.sdist]
only-include = ["src/datalegion_cli", "tests", "LICENSE"]
exclude = ["tests/test_conventions.py", "tests/_conventions.py"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# A byte-identical copy of datalegion-shared's module, held to shared's lint, not edited here
"tests/_conventions.py" = ["SIM", "TC"]

[tool.ruff.lint.isort]
known-first-party = ["datalegion_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]